# The Java suite, run by hand. The Python rigs and the C# suite stand
# outside it: they want an emulator, unicorn and the .NET SDK, and
# doc/tools.md lists them.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # ConsistencyTest reads the figures of the documents against a
      # build, and skips where rmac is absent. The version is pinned:
      # another rmac assembles other bytes.
      - name: rmac 2.4.3
        run: |
          curl -fsSL -o /tmp/rmac.zip \
            https://rmac.is-slick.com/static/rmac-2.4.3-lin-x64.zip
          unzip -j -o /tmp/rmac.zip -d /tmp/rmac
          sudo install -m 755 /tmp/rmac/rmac /usr/local/bin/rmac
      # GoParityTest reads the Go tree against the Java one and skips
      # where go is absent, so a runner without it is green and asleep.
      - run: go version && rmac | sed -n '7p'
      # A skipped test is a check that did not run, and a run that skips
      # one is green and asleep. bin/suite (doc/tools.md) requires what
      # the skipping tests need, runs the suite and ends with 1 where the
      # count is above 0; a caller runs the same script here.
      - name: the suite, and no skip
        run: bin/suite

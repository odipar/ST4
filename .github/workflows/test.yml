# The Java suite with the six rigs in it, and the C# suite, run by hand
# through bin/suite (doc/tools.md). The benchmarks under 68k/test/emu are
# outside it.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # RigsTest decodes under unicorn.
      - run: python3 -m pip install --quiet unicorn
      # The rigs keep every container the packer writes, in a directory
      # named by the build of the packer (test_st4.py), so a run of an
      # unchanged packer reads them back and a changed one packs them
      # again. The key is the packer's sources, which fix its build.
      - uses: actions/cache@v4
        with:
          path: 68k/test/emu/.st4
          key: st4-rigs-${{ hashFiles('src/main/java/**', 'pom.xml') }}
          restore-keys: st4-rigs-
      # ConsistencyTest reads the figures of the documents against a
      # build, and skips where rmac is absent. The version is pinned:
      # another rmac assembles other bytes.
      - name: rmac 2.4.3
        run: |
          curl -fsSL -o /tmp/rmac.zip \
            https://rmac.is-slick.com/static/rmac-2.4.3-lin-x64.zip
          unzip -j -o /tmp/rmac.zip -d /tmp/rmac
          sudo install -m 755 /tmp/rmac/rmac /usr/local/bin/rmac
      # GoParityTest reads the Go tree against the Java one and skips
      # where go is absent, so a runner without it is green and asleep.
      - run: go version && dotnet --version && rmac | sed -n '7p'
      # A skipped test is a check that did not run, and a run that skips
      # one is green and asleep. bin/suite (doc/tools.md) requires what
      # the skipping tests need, runs the suite and ends with 1 where the
      # count is above 0; a caller runs the same script here.
      - name: the suite, and no skip
        run: bin/suite
